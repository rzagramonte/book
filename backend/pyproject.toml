[tool.black]
line-length = 88
target-version = ["py311"]
exclude = '''
/(
    \.git
  | \.venv
  | venv
  | node_modules
  | dist
  | build
  | migrations
)/
'''

[tool.ruff]
line-length = 88
target-version = "py311"
exclude = ["**/migrations/**"]

[tool.ruff.lint]
select = ["E", "F", "I"]
ignore = ["E501"]
